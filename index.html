<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Chat - Accueil</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .welcome-container {
            text-align: center;
            margin-top: 120px;
        }
        .welcome-container h2 {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome-container p {
            font-size: 16px;
            color: rgba(0, 0, 0, 0.6);
            margin-bottom: 35px;
            line-height: 1.8;
        }
        .welcome-container button {
            width: auto !important;
            padding: 16px 40px !important;
            font-size: 16px !important;
            border-radius: 8px !important;
        }
    </style>
</head>
<body>

<div class="auth-box welcome-container">
    <h2>Bienvenue sur Mini Chat</h2>
    <p>
        Une messagerie instantanée simple et intuitive.<br>
        Connexion sécurisée, navigation fluide et utilisation rapide.
    </p>
    <button onclick="window.location='login.html'">Commencer →</button>
</div>

<script>
const username = localStorage.getItem("username");
if (username) {
    window.location = "chat.html";
}
</script>

</body>
</html>
